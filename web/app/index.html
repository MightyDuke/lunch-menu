<!DOCTYPE html>
<html lang="cs">
<head>
    <title>Kam na oběd?</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/app.webmanifest">

    <link rel="icon" href="/icon_144.png" sizes="144x144">
    <link rel="icon" href="/icon_512.png" sizes="512x512">

    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="/script.js" type="module"></script>
</head>

<body class="is-clipped" x-data="app">
    <div class="hero">
        <div class="hero-body">
            <div class="container has-text-centered">
                <div class="title">
                    Kam na oběd?
                </div>

                <div class="subtitle" x-cloak>
                    <span class="is-capitalized" x-text="getLocalizedWeekName(selectedDate)"></span>,
                    <span x-text="getLocalizedLongFormatDate(selectedDate)"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="navbar has-shadow" x-data="{ 'open': false }">
        <div class="container is-flex-direction-row-reverse">
            <div class="navbar-brand">
                <div class="navbar-item" x-show="!user">
                    <div class="is-flex is-justify-content-center">
                        <div id="google-login"></div>
                    </div>
                </div>

                <template x-if="user">
                    <div class="navbar-menu is-flex py-0">
                        <div class="navbar-item">
                            <figure class="image is-32x32 is-square">
                                <img class="is-rounded" style="max-height: none !important;" :src="user.picture">
                            </figure>

                            <span x-text="user.name"></span>
                        </div>

                        <a class="navbar-item has-text-weight-bold" @click="logout()">Odhlásit se</a>
                    </div>
                </template>

                <a class="navbar-burger has-text-current" @click="open = !open" :class="{ 'is-active': open }">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </a>
            </div>

            <div class="navbar-menu" :class="{ 'is-active': open }">
                <div class="navbar-start">
                    <template x-for="day in getDaysInWeek()">
                        <a 
                            :class="{ 'has-text-weight-bold has-background-selected': selectedDate === day }" 
                            @click="selectedDate = day" 
                            class="navbar-item is-min-width-button is-capitalized" 
                            x-text="getLocalizedWeekName(day)"
                        ></a>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-6 has-min-height-screen">
        <noscript>
            <div class="has-text-centered">
                Pro plnou funkčnost této stránky je nutné povolit JavaScript.
            </div>
        </noscript>

        <div>
            <div class="columns is-tablet is-multiline is-8">
                <template x-for="(establishment, name) in establishments">
                    <div class="column is-half" x-data="menu(name)">
                        <table class="table is-fullwidth" :class="{ 'is-hoverable': user }">
                            <thead>
                                <tr>
                                    <td colspan="2">
                                        <div class="is-flex is-align-items-center">
                                            <a class="is-size-4 mr-auto" :href="establishment.homepage" target="_blank" x-text="establishment.name"></a>
                                        </div>
                                    </td>
                                </tr>
                            </thead>

                            <template x-if="!menu">
                                <tbody>
                                    <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                    <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                    <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                    <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                    <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                </tbody>
                            </template>

                            <template x-if="!establishment.linkOnly && menu && !(selectedDate in menu)">
                                <tr>
                                    <td>
                                        <span class="has-text-body">
                                            Menu není k dispozici
                                        </span>
                                    </td>
                                </tr>
                            </template>

                            <template x-if="(menu && establishment.linkOnly) || (menu && selectedDate in menu)">
                                <tbody>
                                    <template x-for="(item, index) in (!establishment.linkOnly ? chain(menu[selectedDate], menu['week']) : [{ 'name': '(Hlasovat)' }])">
                                        <tr :class="{ 'is-clickable': user }" @click="vote(path())" x-data="{
                                            'path': () => `${selectedDate}/${name}/${index}`
                                        }">
                                            <td>
                                                <span x-text="item.name" :class="{ 'has-text-primary has-text-weight-bold': item.highlight }"></span>

                                                <template x-if="path() in votes">
                                                    <div class="mt-4">
                                                        <template x-for="user in votes[path()]">
                                                            <span class="tag pl-0 mr-2">
                                                                <figure class="image is-32x32">
                                                                    <img class="is-rounded" :src="user.picture">
                                                                </figure>

                                                                <span class="ml-2" x-text="user.name"></span>
                                                            </span>
                                                        </template>
                                                    </div>
                                                </template>
                                            </td>
                                            
                                            <td class="has-text-right">
                                                <template x-if="item.price">
                                                    <span class="has-text-body" x-text="`${item.price}&nbsp;Kč`"></span>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </template>
                        </table>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <div x-show="!isPwa()" x-cloak class="footer has-text-centered">
        <div>
            &copy; 2026 Josef Macháč
        </div>
        
        <div>
            <a href="https://github.com/MightyDuke/lunch-menu" target="_blank">GitHub</a>
            <span> &bull; </span>
            <a href="/docs" target="_blank">API</a>

        </div>
    </div>
</body>

</html>
