<!DOCTYPE html>
<html lang="cs">
<head>
    <title>Kam na oběd?</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/app.webmanifest">

    <link rel="icon" href="/icon_144.png" sizes="144x144">
    <link rel="icon" href="/icon_512.png" sizes="512x512">

    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="/script.js" type="module"></script>
</head>

<body class="is-clipped" x-data="app">
    <div class="hero">
        <div class="hero-body">
            <div class="container has-text-centered">
                <div class="title">
                    Kam na oběd?
                </div>

                <div class="subtitle" x-cloak>
                    <span class="is-capitalized" x-text="getLocalizedWeekName(selectedDate)"></span>,
                    <span x-text="getLocalizedLongFormatDate(selectedDate)"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="navbar is-dark">
        <div class="container px-3 is-flex-direction-row-reverse">
            <div class="navbar-brand">
                <div class="navbar-item" x-show="!user">
                    <div class="is-flex is-justify-content-center">
                        <div id="google-login"></div>
                    </div>
                </div>

                <template x-if="user">
                    <div class="navbar-item is-flex py-0">
                        <figure class="image is-32x32 is-square">
                            <img class="is-rounded" style="max-height: none !important;" :src="user.picture">
                        </figure>
                        <div class="has-text-weight-bold" x-text="user.name"></div>
                        <button class="button" @click="logout()">Odhlásit se</button>
                    </div>
                </template>

                <a class="navbar-burger" @click="toggleMenu()" :class="{ 'is-active': menuOpen }">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </a>
            </div>

            <div class="navbar-menu" :class="{ 'is-active': menuOpen }">
                <div class="navbar-start">
                    <template x-for="day in getDaysInWeek()">
                        <a :class="{ 'has-background-grey-dark': selectedDate === day, 'has-text-weight-bold': selectedDate === day }" @click="selectedDate = day" class="navbar-item is-min-width-button is-capitalized" x-text="getLocalizedWeekName(day)"></a>
                    </template>
                </div>
            </div>
        </div>
    </div>

    <div class="container py-6 has-min-height-screen">
        <noscript>
            <div class="has-text-centered">
                Pro plnou funkčnost této stránky je nutné povolit JavaScript.
            </div>
        </noscript>

        <div>
            <div class="columns is-tablet is-multiline is-8">
                <template x-for="(establishment, name) in establishments">
                    <div class="column is-half">
                        <a :href="establishment.homepage" target="_blank" class="is-size-4 my-1 p-2 mx-2" x-text="establishment.name"></a>

                        <hr class="my-2 mx-3">
                        
                        <template x-if="!establishment.linkOnly">
                            <div x-data="menu(name)">
                                <div x-show="!menu">
                                    <div>
                                        <div class="is-skeleton mx-2 my-3"><span>&nbsp;</span></div>
                                        <div class="is-skeleton mx-2 my-3"><span>&nbsp;</span></div>
                                        <div class="is-skeleton mx-2 my-3"><span>&nbsp;</span></div>
                                        <div class="is-skeleton mx-2 my-3"><span>&nbsp;</span></div>
                                        <div class="is-skeleton mx-2 my-3"><span>&nbsp;</span></div>
                                    </div>
                                </div>

                                <div x-show="menu" x-transition.opacity.duration.200ms>
                                    <div class="mx-2">
                                        <template x-if="menu === null || !menu[selectedDate]">
                                            <div class="my-1 p-2">
                                                Menu není k dispozici.
                                            </div>
                                        </template>

                                        <template x-if="menu !== null && menu[selectedDate]">
                                            <div>
                                                <template x-for="(item, index) in menu[selectedDate]">
                                                    <div class="is-clickable" x-data="{
                                                        'path': () => `${selectedDate}/${name}/${index}`
                                                    }">
                                                        <div 
                                                            class="is-flex is-mobile is-rounded my-1 px-2 py-1" 
                                                            :class="{'has-background-primary-soft': item.highlight}"
                                                            @click="vote(path())"
                                                        >
                                                            <div class="is-flex-grow-5 has-text-strong pr-4" x-text="item.name"></div>
                                                            
                                                            <template x-if="item.price">
                                                                <div x-text="`${item.price}&nbsp;Kč`"></div>
                                                            </template>
                                                        </div>

                                                        <template x-if="path() in votes">
                                                            <div class="px-2 pt-1 pb-2">
                                                                <template x-for="user in votes[path()]">
                                                                    <span class="tag pl-0 mr-2">
                                                                        <figure class="image is-32x32">
                                                                            <img class="is-rounded" :src="user.picture">
                                                                        </figure>
                                                                        <span class="ml-1" x-text="user.name"></span>
                                                                    </span>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>

                                                <template x-if="'week' in menu">
                                                    <div>
                                                        <div class="px-2 py-4">
                                                            Týdenní menu
                                                        </div>
                                                        
                                                        <template x-for="(item, index) in menu.week">
                                                            <div class="is-clickable" x-data="{
                                                                    'path': () => `${selectedDate}/${name}/week/${index}`
                                                                }"
                                                            >
                                                                <div 
                                                                    class="is-flex is-mobile is-rounded my-1 px-2 py-1" 
                                                                    :class="{'has-background-primary-soft': item.highlight}"
                                                                    @click="vote(path())"
                                                                >
                                                                    <div class="is-flex-grow-5 has-text-strong pr-4" x-text="item.name"></div>
                                                                    
                                                                    <template x-if="item.price">
                                                                        <div x-text="`${item.price}&nbsp;Kč`"></div>
                                                                    </template>
                                                                </div>

                                                                <template x-if="path() in votes">
                                                                    <div class="px-2 pt-1 pb-2">
                                                                        <template x-for="user in votes[path()]">
                                                                            <span class="tag pl-0 mr-2">
                                                                                <figure class="image is-32x32">
                                                                                    <img class="is-rounded" :src="user.picture">
                                                                                </figure>
                                                                                <span class="ml-1" x-text="user.name"></span>
                                                                            </span>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>

                        <template x-if="establishment.linkOnly">
                            <div class="my-3">
                                <a class="mx-2 px-2 py-1" :href="establishment.homepage" target="_blank">
                                    Odkaz na menu
                                </a>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <div x-show="!isPwa()" x-cloak class="footer has-text-centered">
        <div>
            &copy; 2026 Josef Macháč
        </div>
        
        <div>
            <a href="https://github.com/MightyDuke/lunch-menu" target="_blank">GitHub</a>
        </div>
    </div>
</body>

</html>
