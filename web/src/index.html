<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Kam na oběd?</title>

    <link rel="stylesheet" href="/style.css">
    <link rel="manifest" href="/app.webmanifest">

    <link rel="icon" href="/icon_144.png" sizes="144x144">
    <link rel="icon" href="/icon_512.png" sizes="512x512">

    <script src="/script.js" type="module"></script>
</head>

<body class="is-clipped" x-data="app">
    <div class="hero">
        <div class="hero-body">
            <div class="container has-text-centered">
                <div class="title">
                    Kam na oběd?
                </div>

                <div class="subtitle" x-cloak>
                    <span class="is-capitalized" x-text="getLocalizedWeekName(selectedDate)"></span>,
                    <span x-text="getLocalizedLongFormatDate(selectedDate)"></span>
                </div>
            </div>
        </div>
    </div>

    <div class="navbar" x-data="{ 'open': false }">
        <div class="container is-flex-direction-row-reverse">
            <div class="navbar-brand ml-0" @click="open = !open">
                <template x-if="user">
                    <div class="navbar-menu is-flex py-0">
                        <div class="navbar-item py-0">
                            <template x-if="user.picture">
                                <figure class="image is-32x32 is-square">
                                    <img class="is-rounded" style="max-height: none !important;" :src="user.picture">
                                </figure>
                            </template>

                            <span class="has-text-weight-bold" x-text="user.name"></span>
                        </div>

                        <a class="navbar-item is-hidden-touch" @click="settingsOpen = true">Přizpůsobit</a>
                        <a class="navbar-item is-hidden-touch" @click="logout()">Odhlásit se</a>
                    </div>
                </template>

                <template x-if="!user">
                    <div class="navbar-item is-hidden-desktop">
                        Nepřihlášen(a)
                    </div>
                </template>

                <a class="navbar-burger has-text-current" :class="{ 'is-active': open }">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </a>
            </div>

            <div class="navbar-menu" :class="{ 'is-active': open }">
                <div class="navbar-start">
                    <template x-for="day in getDaysInWeek()">
                        <a 
                            :class="{ 'is-active': selectedDate === day }" 
                            @click="selectedDate = day" 
                            class="navbar-item is-min-width-button is-capitalized" 
                            x-text="getLocalizedWeekName(day)"
                        ></a>
                    </template>
                </div>

                <hr class="my-3">

                <template x-if="user">
                    <div>
                        <a class="navbar-item is-hidden-desktop" @click="settingsOpen = true">Přizpůsobit</a>
                        <a class="navbar-item is-hidden-desktop" @click="logout()">Odhlásit se</a>
                    </div>
                </template>

                <template x-if="user === null">
                    <div class="navbar-end">
                        <div class="navbar-item">
                            Přihlásit se přes účet: 
                        </div>

                        <a class="navbar-item is-flex is-align-items-center" @click="loginMicrosoft()">
                            <div class="icon-text">
                                <div class="icon">
                                    <svg viewBox="0 0 512 512" style="width:24px">
                                        <path d="M0 32l214.6 0 0 214.6-214.6 0 0-214.6zm233.4 0l214.6 0 0 214.6-214.6 0 0-214.6zM0 265.4l214.6 0 0 214.6-214.6 0 0-214.6zm233.4 0l214.6 0 0 214.6-214.6 0 0-214.6z"/>
                                    </svg>
                                </div>
                                <span>
                                    Microsoft
                                </span>
                            </div>
                        </a>

                        <a class="navbar-item is-flex is-align-items-center" @click="loginGoogle()">
                            <div class="icon-text">
                                <div class="icon">
                                    <svg viewBox="0 0 512 512" style="width:24px">
                                        <path d="M500 261.8C500 403.3 403.1 504 260 504 122.8 504 12 393.2 12 256S122.8 8 260 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9c-88.3-85.2-252.5-21.2-252.5 118.2 0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9l-140.8 0 0-85.3 236.1 0c2.3 12.7 3.9 24.9 3.9 41.4z"/>
                                    </svg>
                                </div>
                                <span>
                                    Google
                                </span>
                            </div>
                        </a>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <div class="container py-6 has-min-height-screen">
        <noscript>
            <div class="has-text-centered">
                Pro plnou funkčnost této stránky je nutné povolit JavaScript.
            </div>
        </noscript>

        <div>
            <div class="columns is-tablet is-multiline is-8">
                <template x-for="establishment in establishments" :key="establishment.key">
                    <template x-if="establishment.enabled">
                        <div class="column is-half" x-data="menu(establishment.key, establishment.linkOnly)">
                            <table class="table is-fullwidth" :class="{ 'is-hoverable': user }">
                                <thead>
                                    <tr>
                                        <td colspan="2">
                                            <div class="is-flex is-align-items-center">
                                                <a class="is-size-4 mr-auto" :href="establishment.homepage" target="_blank" x-text="establishment.name"></a>
                                            </div>
                                        </td>
                                    </tr>
                                </thead>

                                <template x-if="!menu">
                                    <tbody>
                                        <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                        <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                        <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                        <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                        <tr><td><div class="is-skeleton"><span>&nbsp;</span></div></td></tr>
                                    </tbody>
                                </template>

                                <template x-if="!establishment.linkOnly && menu && !(selectedDate in menu)">
                                    <tr>
                                        <td>
                                            <span class="has-text-body">
                                                Menu není k dispozici
                                            </span>
                                        </td>
                                    </tr>
                                </template>

                                <template x-if="(menu && establishment.linkOnly) || (menu && selectedDate in menu)">
                                    <tbody>
                                        <template x-for="(item, index) in chain(menu[selectedDate], menu['week'])">
                                            <tr :class="{ 'is-clickable': user }" @click="vote(selectedDate, establishment.key, `${index}`)" 
                                                x-data="{ get path() { return `${establishment.key}:${index}` } }"
                                            >
                                                <td>
                                                    <span x-text="item.name" :class="{ 'has-text-primary has-text-weight-bold': item.highlight }"></span>

                                                    <template x-if="selectedDate in votes && path in votes[selectedDate]">
                                                        <div class="mt-4 is-flex is-align-items-center">
                                                            <template x-for="user in votes[selectedDate][path]">
                                                                <span class="tag pl-0 mr-2">
                                                                    <template x-if="user.picture">
                                                                        <figure class="image is-32x32">
                                                                            <img class="is-rounded" :src="user.picture">
                                                                        </figure>
                                                                    </template>
                                                                    
                                                                    <span class="ml-2" x-text="user.name"></span>
                                                                </span>
                                                            </template>
                                                        </div>
                                                    </template>
                                                </td>
                                                
                                                <td class="has-text-right">
                                                    <template x-if="item.price">
                                                        <span class="has-text-body" x-text="`${item.price}&nbsp;Kč`"></span>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </template>
                            </table>
                        </div>
                    </template>
                </template>
            </div>
        </div>
    </div>

    <div class="modal" :class="{ 'is-active': settingsOpen }">
        <div class="modal-background"></div>

        <div class="modal-card">
            <div class="modal-card-head has-text-weight-bold is-shadowless pb-0">
                Vyberte, které restaurace chcete vidět. Položky lze přetahovat.
            </div>
            
            <div class="modal-card-body p-5">
                <div x-sort="reorderLayout($item, $position)" class="x-flex">
                    <template x-for="establishment in establishments" :key="establishment.key">
                        <div x-sort:item="establishment.key" class="p-2 my-1 is-grabbable">
                            <input type="checkbox" class="checkbox" x-model="establishment.pendingEnabled">

                            <span x-text="establishment.name" class="pl-1"></span>
                        </div>
                    </template>
                </div>
            </div>
            
            <div class="modal-card-foot p-5 buttons">
                <button class="button" @click="deleteLayout">Výchozí stav</button>
                <button class="button ml-auto" @click="settingsOpen = false">Zrušit</button>
                <button class="button is-success" @click="saveLayout">Uložit</button>
            </div>
        </div>
    </div>

    <div x-show="!isPwa()" x-cloak class="footer has-text-centered">
        <div>
            &copy; 2026 Josef Macháč
        </div>
        
        <div>
            <a href="https://github.com/MightyDuke/lunch-menu" target="_blank">GitHub</a>
            <span> &bull; </span>
            <a href="/docs" target="_blank">API</a>
        </div>
    </div>
</body>

</html>
