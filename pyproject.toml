[project]
name = "lunch-menu"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli] (>=0.140.13,<0.141.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "beautifulsoup4[lxml] (>=4.15.0,<5.0.0)",
    "dateparser (>=1.4.1,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.fastapi]
entrypoint = "main:app"