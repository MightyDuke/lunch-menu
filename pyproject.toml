[project]
name = "lunch-menu"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard-no-fastapi-cloud-cli] (>=0.140.0,<0.141.0)",
    "httpx[http2] (>=0.28.0,<0.29.0)",
    "beautifulsoup4[lxml] (>=4.15.0,<5.0.0)",
    "dateparser (>=1.4.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "verify-oidc-identity (>=0.4.0,<0.5.0)",
    "requests (>=2.34.0,<3.0.0)"
]

[tool.fastapi]
entrypoint = "main:app"
